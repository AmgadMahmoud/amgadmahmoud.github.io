  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #BBB2A9;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
    // The Flutter splash screen takes over from the first frame.
    window.addEventListener("flutter-first-frame", removeSplashFromWeb);
  </script>
  <script id="app-install-script">
    // The browser can offer the install prompt before Flutter has loaded, so
    // the event is kept here and the app reads it through `window.appInstall`.
    window.appInstall = {
      promptEvent: null,
      onChange: null,
      get canInstall() {
        return this.promptEvent !== null;
      },
      setPromptEvent(event) {
        this.promptEvent = event;
        if (this.onChange) this.onChange(this.canInstall);
      },
      async prompt() {
        const event = this.promptEvent;
        if (event === null) return;
        // A prompt event can only be used once.
        this.setPromptEvent(null);
        await event.prompt();
      },
    };
    window.addEventListener("beforeinstallprompt", function (event) {
      event.preventDefault();
      window.appInstall.setPromptEvent(event);
    });
    window.addEventListener("appinstalled", function () {
      window.appInstall.setPromptEvent(null);
    });
  </script>
